<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/otas.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>OTAS</title>
</head>

<body>
  <script>
    // Pre-paint theme: apply the stored preference before React mounts so the
    // mesh background doesn't flash light-then-dark on a hard refresh.
    try {
      if (localStorage.getItem('otas_theme') === 'dark') {
        document.body.classList.add('dark');
      }
    } catch (e) { /* localStorage unavailable — fall back to light */ }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
